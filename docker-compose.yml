services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kindle
      POSTGRES_PASSWORD: kindle
      POSTGRES_DB: kindle
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kindle"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    ports:
      - "3900:3900" # S3 API
      - "3903:3903" # Admin API
    volumes:
      - ./infra/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage-init:
    image: dxflrs/garage:v1.0.1
    depends_on:
      garage:
        condition: service_healthy
    volumes:
      - ./infra/garage.toml:/etc/garage.toml:ro
      - ./infra/garage-bootstrap.sh:/garage-bootstrap.sh:ro
      - garage-shared:/shared
    entrypoint: ["/bin/sh", "/garage-bootstrap.sh"]

volumes:
  postgres-data:
  garage-meta:
  garage-data:
  garage-shared:
