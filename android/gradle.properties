# Project-wide Gradle settings for KindleReader.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# We deliberately use the old android.support.* libraries (not AndroidX) so
# the app can target API 15 without AndroidX's tooling/Jetifier fragility.
android.useAndroidX=false
android.enableJetifier=false

# Keep AAPT2 daemon behavior conservative on constrained build machines.
android.nonTransitiveRClass=false
